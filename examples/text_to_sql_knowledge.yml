    - data:
        code: |
          from urllib.parse import quote_plus

          def main(host: str, port, user: str, password: str, database: str) -> dict:
              host = (host or "").strip()
              port = str(port or "3306").strip()
              user = (user or "").strip()
              password = password or ""
              database = (database or "").strip()

              if not host or not user or not database:
                  return {
                      "db_uri": "",
                      "connection_error": "Thieu db_host, db_user hoac db_name",
                  }

              db_uri = (
                  "mysql+pymysql://"
                  f"{quote_plus(user)}:{quote_plus(password)}@{host}:{port}/{database}"
              )
              return {"db_uri": db_uri, "connection_error": ""}
        code_language: python3
        desc: Ghép SQLAlchemy URI từ input Start
