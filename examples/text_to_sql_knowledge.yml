    - data:
        code: |
          import re

          def main(llm_output: str) -> dict:
              text = (llm_output or "").strip()
              match = re.search(r"```(?:sql)?\s*(.*?)\s*```", text, re.DOTALL | re.IGNORECASE)
              clean_sql = match.group(1).strip() if match else text
              clean_sql = clean_sql.rstrip(";")

              forbidden = [
                  r"\bINSERT\b", r"\bUPDATE\b", r"\bDELETE\b", r"\bDROP\b",
                  r"\bTRUNCATE\b", r"\bALTER\b", r"\bCREATE\b", r"\bGRANT\b",
              ]

              is_safe = True
              reason = "Success"
              for pattern in forbidden:
                  if re.search(pattern, clean_sql, re.IGNORECASE):
                      is_safe = False
                      reason = "Phát hiện từ khóa bị cấm"
                      break

              if is_safe and not clean_sql.upper().lstrip().startswith("SELECT"):
                  is_safe = False
                  reason = "Chỉ cho phép lệnh SELECT"

              return {
                  "is_safe": "true" if is_safe else "false",
                  "sanitized_sql": clean_sql if is_safe else "",
                  "error_message": "" if is_safe else reason,
              }
        code_language: python3
        desc: ''
        outputs:
          error_message:
            children: null
            type: string
          is_safe:
            children: null
            type: string
          sanitized_sql:
            children: null
            type: string
        selected: false
