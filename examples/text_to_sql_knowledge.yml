    - data:
        code: |
          FALLBACK = """### FALLBACK SCHEMA (KB empty) ###
          Glossary: tổ chức=organizations; nhân viên/luật sư=users; khách=clients
          Table: organizations — id, name, legal_name, tax_code, is_active, deleted_at
          Table: users — id, organization_id, name, email, position, status (no deleted_at; never select password)
          Table: clients — id, organization_id, name, email, phone, status, type, profile_kind, lead_stage, assigned_to, created_at, deleted_at
          Table: cases — id, organization_id, code, name, client_id, status, priority, open_date, deadline, lead_lawyer_id, deleted_at
          Table: contracts — id, name, payment_amount, payment_currency, client_id, case_id, expires_at, is_canceled, is_completed, deleted_at
          Table: tasks — id, title, case_id, priority, progress, due_date, deleted_at
          JOIN: users.organization_id=organizations.id; cases.client_id=clients.id; contracts.client_id=clients.id; contracts.case_id=cases.id; tasks.case_id=cases.id
          """

          def main(chunks) -> dict:
              parts = []
              items = chunks if isinstance(chunks, list) else []
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  title = item.get("title") or ""
                  content = item.get("content") or ""
                  if content.strip():
                      parts.append(f"## {title}\n{content}".strip())
              schema_docs = "\n\n".join(parts) if parts else FALLBACK
              return {"schema_docs": schema_docs, "hit_count": len(parts)}
        code_language: python3
        desc: Ghép chunk KB thành schema text; fallback nếu chưa gắn dataset
        outputs:
          hit_count:
            children: null
            type: number
          schema_docs:
            children: null
            type: string
        selected: false
        title: Format Schema Docs
        type: code
        variables:
        - value_selector:
          - knowledge_retrieval
          - result
          value_type: array[object]
          variable: chunks
      height: 54
      id: format_schema
