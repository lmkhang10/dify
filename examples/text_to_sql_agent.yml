version: 0.7.0
kind: app
app:
  name: Text-to-SQL Agent (LFMS)
  description: |
    Agent debug (/agent/) — KHÔNG có canvas workflow. Debug node: Chatflow
    text_to_sql_workflow_agent.yml + Show workflow steps.

    User Input:
    - lfms_api_base = https://lfms-dev.truyenfox.net
    - lfms_token = JWT thô. Tab đã login LFMS, Console:

    const csrf = document.querySelector('meta[name="csrf-token"]')?.content ?? ''
    const xsrf = decodeURIComponent((document.cookie.match(/(?:^|; *)XSRF-TOKEN=([^;]+)/) || [])[1] ?? '')
    const res = await fetch('https://lfms-dev.truyenfox.net/api/embed/dify-token', {
      method: 'POST', credentials: 'include',
      headers: { Accept: 'application/json', 'X-Requested-With': 'XMLHttpRequest',
        ...(csrf ? { 'X-CSRF-TOKEN': csrf } : {}), ...(xsrf ? { 'X-XSRF-TOKEN': xsrf } : {}) },
    })
    const body = await res.json(); console.log(res.status, body); copy(body.embed_token)

    HMAC: Environment DIFY_LFMS_HMAC_SECRET. Khách dùng Chatflow /chatbot/ + bubble.
  icon: 🧭
  icon_background: '#E8F3FF'
  mode: agent
  use_icon_as_answer_icon: false
dependencies: []
agent:
  package_ref: agent_1
agent_packages:
  agent_1:
    schema_version: 1
    metadata:
      name: LFMS Text-to-SQL
      description: Read-only SQL via LFMS gateway (embed JWT + HMAC)
      role: sql analyst
      icon_type: emoji
      icon: 🧭
      icon_background: '#E8F3FF'
    omitted_assets:
      - kind: skill
        name: lfms-sql-guarded
        size: null
        hash: null
        mime_type: application/zip
    workspace_skills:
      - name: lfms-sql-guarded
        display_name: LFMS SQL guarded
        description: Read-only LFMS SQL + Policy (no super-admin, no secrets).
        priority: 0
    soul:
      schema_version: 1
      prompt:
        system_prompt: |
          You are a read-only MySQL analyst for LFMS. This Agent Studio app cannot
          call LFMS execute unless the operator pasted lfms_token. Prefer telling
          the user to use the LFMS Admin chat bubble (Chatflow).

          If lfms_token or lfms_api_base is empty, do not invent SQL results.
          Reply in Vietnamese: mo bubble LFMS hoac dan JWT tu console fetch
          POST https://lfms-dev.truyenfox.net/api/embed/dify-token va
          lfms_api_base=https://lfms-dev.truyenfox.net.

          Always reply in Vietnamese. Never print SQL.
      tools:
        dify_tools: []
        cli_tools: []
      knowledge:
        sets: []
      human:
        contacts: []
        tools: []
      env:
        variables: []
        secret_refs: []
      config_skills:
        - name: lfms-sql-guarded
          description: Read-only LFMS SQL + Policy (no super-admin, no secrets).
          file_kind: tool_file
          file_id: ''
          is_missing: true
          size: null
          hash: null
          mime_type: application/zip
      config_files: []
      config_note: |
        lfms_api_base = https://lfms-dev.truyenfox.net
        lfms_token: console fetch POST /api/embed/dify-token tren tab login LFMS.
      sandbox: {}
      memory: {}
      model: null
      app_features: {}
      app_variables:
        - name: lfms_token
          type: paragraph
          required: false
          default: ''
        - name: lfms_api_base
          type: paragraph
          required: false
          default: https://lfms-dev.truyenfox.net
      misc_legacy: {}
