version: 0.7.0
kind: app
app:
  name: Text-to-SQL Agent (LFMS)
  description: |
    Agent v2: Skill quy tắc SQL + Knowledge schema + plugin database.

    Import tạo Agent App. Skill archive không nằm trong DSL — upload
    examples/skills/lfms-sql-guarded.skill rồi gắn vào Agent.
    Knowledge sets để trống: gắn dataset LFMS schema trong composer.
    Authorize plugin hjlarry/database (db_uri workspace) rồi chọn model.
    Khách không nhập connection string — xem examples/README.md.
  icon: 🧭
  icon_background: '#E8F3FF'
  mode: agent
  use_icon_as_answer_icon: false
dependencies:
  - type: marketplace
    value:
      marketplace_plugin_unique_identifier: hjlarry/database:0.0.5
    current_identifier: null
agent:
  package_ref: agent_1
agent_packages:
  agent_1:
    schema_version: 1
    metadata:
      name: LFMS Text-to-SQL
      description: Read-only SQL agent for lfms_db
      role: sql analyst
      icon_type: emoji
      icon: 🧭
      icon_background: '#E8F3FF'
    omitted_assets:
      - kind: skill
        name: lfms-sql-guarded
        size: null
        hash: null
        mime_type: application/zip
    workspace_skills:
      - name: lfms-sql-guarded
        display_name: LFMS SQL guarded
        description: Read-only LFMS SQL + Policy (no super-admin, no secrets).
        priority: 0
    soul:
      schema_version: 1
      prompt:
        system_prompt: |
          You are a read-only MySQL analyst for LFMS (law-firm).
          Follow skill lfms-sql-guarded (Policy block). Use Knowledge first; call table_schema if columns unclear.
          Credentials are authorized — never ask for db_uri; omit db_uri on tool calls.

          LANGUAGE: Always reply in Vietnamese — status, errors, and final answer.
          Never switch to English prose unless the user explicitly asks for English.

          SECURITY — never expose SQL or schema to end users:
          - Do NOT print SQL (no fenced sql blocks, no inline SELECT) in any visible message.
          - Do NOT echo table/column names, JOIN, or WHERE in chat unless user explicitly asks for technical details.
          - SQL goes only to sql_execute tool arguments — never into the chat text.

          BEFORE any tool call, write one short business line in the visible message:
          **Đang xử lý:** <1 dòng tiếng Việt, mô tả nghiệp vụ, không kỹ thuật>

          Then call sql_execute internally (SELECT only, LIMIT 100,
          deleted_at IS NULL on clients/cases/contracts/tasks, never users.password).

          After tool result: tóm tắt tiếng Việt + bảng markdown nếu hữu ích.
          Không SQL, không liệt kê bảng/cột kỹ thuật trong câu trả lời cuối.
      tools:
        dify_tools:
          - enabled: true
            provider_type: builtin
            provider_id: hjlarry/database/database
            plugin_id: hjlarry/database
            provider: database
            tool_name: sql_execute
            credential_type: unauthorized
            credential_ref: null
            description: Execute a SQL query
            runtime_parameters: {}
          - enabled: true
            provider_type: builtin
            provider_id: hjlarry/database/database
            plugin_id: hjlarry/database
            provider: database
            tool_name: table_schema
            credential_type: unauthorized
            credential_ref: null
            description: Get live table schema from the database
            runtime_parameters: {}
        cli_tools: []
      knowledge:
        sets: []
      human:
        contacts: []
        tools: []
      env:
        variables: []
        secret_refs: []
      config_skills:
        - name: lfms-sql-guarded
          description: Read-only LFMS SQL + Policy (no super-admin, no secrets).
          file_kind: tool_file
          file_id: ''
          is_missing: true
          size: null
          hash: null
          mime_type: application/zip
      config_files: []
      config_note: ''
      sandbox: {}
      memory: {}
      model: null
      app_features: {}
      app_variables: []
      misc_legacy: {}
