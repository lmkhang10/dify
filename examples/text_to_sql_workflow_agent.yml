      - data:
          code: "import json\n\ndef main(http_status, http_body: str) -> dict:\n    fallback = \"Thẻ quyền trống. Chỉ viết SELECT tối thiểu. LFMS từ chối bảng hoặc cột ngoài quyền.\"\n    try:\n        status = int(http_status or 0)\n    except (TypeError, ValueError):\n        status = 0\n    if status < 200 or status >= 300:\n        return {\"grant_text\": fallback}\n    try:\n        parsed = json.loads(http_body or \"\")\n    except json.JSONDecodeError:\n        return {\"grant_text\": fallback}\n    if not isinstance(parsed, dict) or not parsed.get(\"ok\"):\n        return {\"grant_text\": fallback}\n    tables = [str(t) for t in (parsed.get(\"tables\") or [])]\n    mine = [str(t) for t in (parsed.get(\"mine_tables\") or [])]\n    office = [str(t) for t in (parsed.get(\"office_tables\") or [])]\n    denied = parsed.get(\"denied_columns\") or {}\n    lines = [\"THẺ QUYỀN (đọc mỗi câu, không theo vai trò):\"]\n    lines.append(\"Bảng được FROM/JOIN: \" + (\", \".join(tables) if tables else \"(không có)\"))\n    if mine:\n        lines.append(\"Của tôi (LFMS tự lọc, không viết id người, không organization_id): \" + \", \".join(mine))\n    if office:\n        lines.append(\"Cả văn phòng: \" + \", \".join(office))\n    bits = []\n    if isinstance(denied, dict):\n        for table, cols in denied.items():\n            if isinstance(cols, list) and cols:\n                bits.append(str(table) + \": \" + \", \".join(str(c) for c in cols))\n    if bits:\n        lines.append(\"Cột cấm (kể cả trong SUM/WHERE): \" + \"; \".join(bits))\n    lines.append(\"Bảng không có trên thẻ: không JOIN, không đoán id. Cần tên người mà không có users: trả UNSUPPORTED_PERSON.\")\n    lines.append(\"Tên nhân sự do LFMS điền («người phụ trách», «người tạo», …): chỉ khi đó là chính người hỏi, hoặc khi users có trên thẻ. Không tự JOIN để lấy tên. Cột trong mục cấm (tiền, điện thoại, email) không được điền thay, kể cả của chính người hỏi.\")\n    return {\"grant_text\": \"\\n\".join(lines)}\n"
