son):\n        out = dict(empty)\n        out[\"user_message\"] = msg\n        return out\n    raw_kind = stype.strip().lower()\n    if raw_kind in (\"pie\", \"donut\", \"rose\"):\n        kind = \"pie\"\n    elif raw_kind in (\"bar\", \"column\"):\n        kind = \"bar\"\n    else:\n        kind = \"line\"\n    return {\n        \"user_message\": msg,\n        \"has_chart\": \"true\",\n        \"chart_kind\": kind,\n        \"chart_title\": title,\n        \"chart_data\": \";\".join(nums),\n        \"chart_labels\": \";\".join(labs),\n    }\n"
