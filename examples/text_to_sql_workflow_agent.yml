      - data:
          code: |
            FALLBACK = """### FALLBACK SCHEMA (KB empty) ###
            Glossary: khách=clients (profile_kind client|lead); vụ=cases (category litigation|legal_service); HĐ=contracts.payment_amount; đợt thu=payments; việc=tasks + task_assignees
            KHÔNG JOIN organizations/departments/case_types chỉ để lấy tên. Không subquery/UNION/WITH/SELECT *.
            Table: clients — id, organization_id, name, profile_kind, type, status, lead_stage, assigned_to, created_by, deleted_at
            Table: cases — id, code, name, client_id, category, status (new|in_progress|on_hold|closed), held_at, fee_estimate, billing_method, lead_lawyer_id, deleted_at. Cấm cột on_hold boolean.
            Table: contracts — id, name, type, status, template_id, client_id, case_id, payment_amount, payment_currency, payment_due_date, is_canceled, is_completed, deleted_at
            Table: tasks — id, title, case_id, created_by, priority, progress, due_date, deleted_at. Không cột status/assigned_to.
            Table: task_assignees — task_id, user_id
            Table: payments — contract_id, amount, currency, due_date, status, direction, paid_at
            Table: users — id, name, position, status (active|away|inactive); cấm password
            Table: organizations — id, name, is_active, deleted_at; cấm smtp_password; đừng JOIN trang trí
            JOIN tối thiểu: cases.client_id=clients.id; contracts.client_id=clients.id; payments.contract_id=contracts.id
            Bảng cấm: service_plans, organization_subscriptions, case_checklist_items, workflow_versions, vanna_*
            """

            def main(chunks) -> dict:
                parts = []
                items = chunks if isinstance(chunks, list) else []
                for item in items:
                    if not isinstance(item, dict):
                        continue
                    title = item.get("title") or ""
                    content = item.get("content") or ""
                    if content.strip():
                        parts.append(f"## {title}\n{content}".strip())
                schema_docs = "\n\n".join(parts) if parts else FALLBACK
                return {"schema_docs": schema_docs, "hit_count": len(parts)}

          code_language: python3
          desc: Ghép chunk KB; fallback nếu chưa gắn dataset
          outputs:
            hit_count:
              children: null
              type: number
            schema_docs:
              children: null
              type: string
          selected: false
          title: Format Schema Docs
          type: code
