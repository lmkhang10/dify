      - data:
          code: |
            import base64
            import gzip
            import json
            import zlib

            def _as_text(value):
                if value is None:
                    return ""
                if isinstance(value, (bytes, bytearray)):
                    return bytes(value).decode("utf-8", "replace")
                return str(value).strip()

            def _maybe_decompress(value):
                raw = _as_text(value)
                if not raw:
                    return "", "empty"
                if raw.startswith(("eyJ", "http://", "https://")):
                    return raw, "plain"
                try:
                    padded = raw + "=" * ((4 - len(raw) % 4) % 4)
                    blob = base64.b64decode(padded.replace("-", "+").replace("_", "/"), validate=False)
                except Exception as exc:
                    return raw, "b64_fail:" + type(exc).__name__
                if blob[:2] != b"\x1f\x8b":
                    return raw, "not_gzip"
                try:
                    return gzip.decompress(blob).decode("utf-8").strip(), "gzip"
                except Exception as gzip_exc:
                    header = 10
                    if len(blob) > 10 and blob[3] & 0x08:
                        z = blob.find(b"\x00", 10)
                        header = z + 1 if z != -1 else 10
                    payload = blob[header:-8] if len(blob) > header + 8 else blob[header:]
                    try:
                        out = zlib.decompress(payload, -zlib.MAX_WBITS)
                        return out.decode("utf-8").strip(), "gzip_ignore_crc"
                    except Exception:
                        try:
                            d = zlib.decompressobj(-zlib.MAX_WBITS)
                            out = d.decompress(payload)
                            text = out.decode("utf-8", "replace").strip()
                            if text:
                                return text, "gzip_truncated:" + type(gzip_exc).__name__
                        except Exception:
                            pass
                    return raw, "gzip_fail:" + type(gzip_exc).__name__

            def _is_jwt(token):
                parts = (token or "").split(".")
                if len(parts) != 3 or not all(parts):
                    return False
                if len(parts[2]) < 40:
                    return False
                try:
                    padded = parts[1] + "=" * ((4 - len(parts[1]) % 4) % 4)
                    json.loads(base64.urlsafe_b64decode(padded))
                    return True
                except Exception:
                    return False

            def _dump(token_in, base_in, token, base, token_how, base_how, code, reason):
                lines = [
                    "Không khả thi khi sử dụng trực tiếp!" if code else "Embed OK — giá trị đã giải nén:",
                    "",
                ]
                if code:
                    lines += ["Mã: " + code, "Chi tiết: " + reason, ""]
                lines += [
                    "=== lfms_token đã giải nén (decode=" + token_how + ") ===",
                    token or "(rỗng)",
                    "",
                    "=== lfms_api_base đã giải nén (decode=" + base_how + ") ===",
                    base or "(rỗng)",
                    "",
                    "=== raw Start.lfms_token ===",
                    _as_text(token_in) or "(rỗng)",
                    "",
                    "=== raw Start.lfms_api_base ===",
                    _as_text(base_in) or "(rỗng)",
                ]
                return "\n".join(lines)

            def _reject(code, reason, token_in, base_in, token, base, token_how, base_how):
                return {
                    "embed_ok": "false",
                    "error_message": _dump(token_in, base_in, token, base, token_how, base_how, code, reason),
                    "embed_token": token or "",
                    "api_base": base or "",
                }

            def main(lfms_token=None, lfms_api_base=None):
                token_in = lfms_token
                base_in = lfms_api_base
                token, token_how = _maybe_decompress(token_in)
                base, base_how = _maybe_decompress(base_in)
                base = (base or "").rstrip("/")

                if token_how.startswith("gzip_truncated") or token_how.startswith("gzip_fail"):
                    return _reject(
                        "EMBED_BAD_JWT",
                        "lfms_token gzip bị cắt — chữ ký JWT hỏng, LFMS trả TOKEN_INVALID.",
                        token_in, base_in, token, base, token_how, base_how,
                    )

                if not _as_text(token_in):
                    return _reject(
                        "EMBED_MISSING_TOKEN",
                        "Workflow không nhận lfms_token (inputs rỗng). Thường do iframe /chat/ hoặc embed.js gzip lỗi rồi nuốt param.",
                        token_in, base_in, token, base, token_how, base_how,
                    )
                if not _as_text(base_in):
                    return _reject(
                        "EMBED_MISSING_API_BASE",
                        "Workflow không nhận lfms_api_base.",
                        token_in, base_in, token, base, token_how, base_how,
                    )
                if not base.startswith(("http://", "https://")):
                    return _reject(
                        "EMBED_BAD_API_BASE",
                        "lfms_api_base sau giải nén không phải URL http(s).",
                        token_in, base_in, token, base, token_how, base_how,
                    )
                if not _is_jwt(token):
                    return _reject(
                        "EMBED_BAD_JWT",
                        "Token không phải JWT hợp lệ (3 đoạn, payload JSON). Gzip lfms_token trên URL CRC fail / stream bị cắt.",
                        token_in, base_in, token, base, token_how, base_how,
                    )

                return {
                    "embed_ok": "true",
                    "error_message": _dump(token_in, base_in, token, base, token_how, base_how, "", ""),
                    "embed_token": token,
                    "api_base": base,
                }
          code_language: python3
          desc: Chặn sớm khi mở /chat trực tiếp hoặc thiếu tham số embed từ LFMS
          outputs:
            api_base:
              children: null
              type: string
            embed_ok:
