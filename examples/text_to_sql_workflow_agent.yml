        transfer_methods:
          - local_file
          - remote_url
      number_limits: 3
    opening_statement: Xin chào, tôi là AI Chatbot hỗ trợ bạn.
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - '{{starter_1}}'
      - '{{starter_2}}'
      - '{{starter_3}}'
      - '{{starter_4}}'
      - '{{starter_5}}'
    suggested_questions_after_answer:
      enabled: true
      prompt: 'Đề xuất đúng 3 câu hỏi tiếp theo bằng tiếng Việt. Mỗi câu là một
        việc tra cứu trong phần mềm quản lý văn phòng luật: vụ việc, khách hàng,
        hợp đồng, công việc, công văn, lịch hoặc tài liệu của người đang chat.
        Không hỏi luật bên ngoài, không hỏi tin tức, không hỏi chuyện chung. Nếu
        câu vừa rồi không được xem, đừng gợi ý lại chủ đề đó.'
