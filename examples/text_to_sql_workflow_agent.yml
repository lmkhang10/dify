            ,\n        \"\",\n        \"=== raw Start.lfms_token ===\",\n        _as_text(token_in)\
            \ or \"(rỗng)\",\n        \"\",\n        \"=== raw Start.lfms_api_base ===\"\
            ,\n        _as_text(base_in) or \"(rỗng)\",\n    ]\n    return \"\\n\".join(lines)\n\
            \ndef _reject(code, reason, token_in, base_in, token, base, token_how, base_how):\n\
