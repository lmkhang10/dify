      - data:
          code: |
            import json

            def _denial(parsed, message: str):
                codes = []
                names = []
                if isinstance(parsed, dict):
                    for v in parsed.get("violations") or []:
                        if isinstance(v, dict):
                            codes.append(str(v.get("code") or ""))
                            names.append(str(v.get("name") or ""))
                    codes.append(str(parsed.get("code") or ""))
                text = (message or "") + " " + " ".join(codes) + " " + " ".join(names)
                kind = ""
                if "TABLE_DENIED" in text:
                    kind = "TABLE_DENIED"
                elif "COLUMN_DENIED" in text:
                    kind = "COLUMN_DENIED"
                retry = "true" if kind else "false"
                return retry, kind, " ".join(n for n in names if n).strip()

            def main(http_status, http_body: str) -> dict:
                fail = {
                    "is_ok": "false",
                    "data_json": "[]",
                    "row_count": "0",
                    "error_message": "Không kết nối được LFMS SQL Gateway",
                    "can_retry": "false",
                    "denial_kind": "",
                    "denied_name": "",
                }
                try:
                    status = int(http_status or 0)
                except (TypeError, ValueError):
                    status = 0

                body_text = (http_body or "").strip()
                parsed = None
                if body_text:
                    try:
                        parsed = json.loads(body_text)
                    except json.JSONDecodeError:
                        parsed = None

                if status < 200 or status >= 300:
                    extra = ""
                    if isinstance(parsed, dict):
                        code = parsed.get("code") or ""
                        msg = parsed.get("message") or ""
                        extra = (str(code) + " " + str(msg)).strip()
                    elif body_text:
                        extra = body_text[:500]
                    err = f"LFMS lỗi HTTP {status}"
                    if extra:
                        err = err + " — " + extra
                    if status in (401, 403) and (not extra or "HMAC" in extra or extra == ""):
                        err = err + "\nGợi ý: điền DIFY_LFMS_HMAC_SECRET trên Dify (Workflow → Environment) trùng apps/.env LFMS. Secret rỗng = thiếu chữ ký."
                    return {**fail, "error_message": err}

                if not isinstance(parsed, dict):
                    return {**fail, "error_message": "Phản hồi LFMS không hợp lệ"}

                if bool(parsed.get("ok")):
                    rows = parsed.get("data")
                    if not isinstance(rows, list):
                        rows = []
                    try:
                        row_count = int(parsed.get("row_count", len(rows)))
                    except (TypeError, ValueError):
                        row_count = len(rows)
                    return {
                        "is_ok": "true",
                        "data_json": json.dumps(rows, ensure_ascii=False),
                        "row_count": str(row_count),
                        "error_message": "",
                        "can_retry": "false",
                        "denial_kind": "",
                        "denied_name": "",
                    }

                message = parsed.get("message") or "Truy vấn không được phép"
                retry, kind, denied_name = _denial(parsed, str(message))
                return {
                    "is_ok": "false",
                    "data_json": "[]",
                    "row_count": "0",
                    "error_message": str(message),
                    "can_retry": retry,
                    "denial_kind": kind,
                    "denied_name": denied_name,
                }

          code_language: python3
          desc: Map { ok, data[], message } từ LFMS
          outputs:
            data_json:
              children: null
              type: string
            error_message:
              children: null
              type: string
            is_ok:
              children: null
              type: string
            row_count:
