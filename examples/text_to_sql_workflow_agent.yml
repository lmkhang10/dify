      - data:
          code: "import hashlib\nimport hmac\nimport json\nimport re\nimport time\n\
            import uuid\n\nLFMS_EXECUTE_PATH = \"/api/internal/dify/sql/execute\"\n\
            HTTP_METHOD = \"POST\"\n\ndef _sign(raw_body: str, timestamp: str, nonce:\
            \ str, secret: str) -> str:\n    body_hash = hashlib.sha256(raw_body.encode(\"\
            utf-8\")).hexdigest()\n    signing_string = f\"{timestamp}\\n{nonce}\\n{HTTP_METHOD}\\\
            n{LFMS_EXECUTE_PATH}\\n{body_hash}\"\n    return hmac.new(\n        secret.encode(\"\
            utf-8\"),\n        signing_string.encode(\"utf-8\"),\n        hashlib.sha256,\n\
            \    ).hexdigest()\n\ndef main(\n    llm_output: str,\n    lfms_token: str,\n\
            \    user_query: str,\n    hmac_secret: str,\n    conversation_id: str,\n\
            \    dify_user_id: str,\n    conversation_title: str,\n) -> dict:\n    text\
            \ = (llm_output or \"\").strip()\n    match = re.search(r\"```(?:sql)?\\\
            s*(.*?)\\s*```\", text, re.DOTALL | re.IGNORECASE)\n    clean_sql = match.group(1).strip().rstrip(\"\
            ;\") if match else text.rstrip(\";\").strip()\n\n    payload = {\n     \
            \   \"embed_token\": (lfms_token or \"\").strip(),\n        \"sql\": clean_sql,\n\
            \        \"natural_language_query\": user_query or \"\",\n        \"request_id\"\
            : str(uuid.uuid4()),\n        \"context\": {\n            \"source\": \"\
            dify\",\n            \"app\": \"text_to_sql_chatflow\",\n            \"\
            dify_conversation_id\": (conversation_id or \"\").strip(),\n           \
            \ \"dify_user_id\": (dify_user_id or \"\").strip(),\n            \"conversation_title\"\
            : (conversation_title or \"\").strip(),\n        },\n    }\n    request_json\
            \ = json.dumps(payload, ensure_ascii=False, separators=(\",\", \":\"))\n\
            \    timestamp = str(int(time.time()))\n    nonce = str(uuid.uuid4())\n\
            \    secret = (hmac_secret or \"\").strip()\n    if not secret:\n      \
            \  return {\n            \"request_json\": request_json,\n            \"\
            timestamp\": timestamp,\n            \"nonce\": nonce,\n            \"signature\"\
            : \"\",\n        }\n    signature = _sign(request_json, timestamp, nonce,\
            \ secret)\n\n    return {\n        \"request_json\": request_json,\n   \
            \     \"timestamp\": timestamp,\n        \"nonce\": nonce,\n        \"signature\"\
            : signature,\n    }\n"
          code_language: python3
          desc: Tách SQL + HMAC theo examples/docs/lfms-sql-policy-api.md §3
