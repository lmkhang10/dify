          code: "import json\n\ndef _denial(parsed, message: str):\n    codes = []\n\
            \    names = []\n    if isinstance(parsed, dict):\n        for v in parsed.get(\"\
            violations\") or []:\n            if isinstance(v, dict):\n            \
            \    codes.append(str(v.get(\"code\") or \"\"))\n                names.append(str(v.get(\"\
            name\") or \"\"))\n        codes.append(str(parsed.get(\"code\") or \"\"\
            ))\n    text = (message or \"\") + \" \" + \" \".join(codes) + \" \" + \"\
            \ \".join(names)\n    kind = \"\"\n    if \"ACTOR_ID_DENIED\" in text:\n        return \"false\", \"ACTOR_ID_DENIED\", \"\"\n    if \"TABLE_DENIED\" in text:\n  \
            \      kind = \"TABLE_DENIED\"\n    elif \"COLUMN_DENIED\" in text:\n  \
            \      kind = \"COLUMN_DENIED\"\n    elif \"BINDING_DENIED\" in text:\n\
            \        kind = \"BINDING_DENIED\"\n    elif \"Unknown column\" in text:\n        kind = \"UNKNOWN_COLUMN\"\n    retry = \"true\" if kind else \"\
            false\"\n    return retry, kind, \" \".join(n for n in names if n).strip()\n\
            \ndef main(http_status, http_body: str) -> dict:\n    fail = {\n       \
            \ \"is_ok\": \"false\",\n        \"data_json\": \"[]\",\n        \"row_count\"\
            : \"0\",\n        \"error_message\": \"Không kết nối được. Hãy thử lại sau.\"\
            ,\n        \"can_retry\": \"false\",\n        \"denial_kind\": \"\",\n \
            \       \"denied_name\": \"\",\n    }\n    try:\n        status = int(http_status\
            \ or 0)\n    except (TypeError, ValueError):\n        status = 0\n\n   \
            \ body_text = (http_body or \"\").strip()\n    parsed = None\n    if body_text:\n\
            \        try:\n            parsed = json.loads(body_text)\n        except\
            \ json.JSONDecodeError:\n            parsed = None\n\n    if status < 200\
            \ or status >= 300:\n        extra = \"\"\n        if isinstance(parsed,\
            \ dict):\n            code = parsed.get(\"code\") or \"\"\n            msg\
            \ = parsed.get(\"message\") or \"\"\n            extra = (str(code) + \"\
            \ \" + str(msg)).strip()\n        elif body_text:\n            extra = body_text[:500]\n\
            \        err = f\"LFMS lỗi HTTP {status}\"\n        if extra:\n        \
            \    err = err + \" — \" + extra\n        if status in (401, 403) and (not\
            \ extra or \"HMAC\" in extra or extra == \"\"):\n            err = err +\
            \ \"\\nGợi ý: điền DIFY_LFMS_HMAC_SECRET trên Dify (Workflow → Environment)\
            \ trùng apps/.env LFMS. Secret rỗng = thiếu chữ ký.\"\n        return {**fail,\
            \ \"error_message\": err}\n\n    if not isinstance(parsed, dict):\n    \
            \    return {**fail, \"error_message\": \"Mình chưa trả lời được lúc này. Hãy thử lại.\"}\n\
            \n    if bool(parsed.get(\"ok\")):\n        rows = parsed.get(\"data\")\n\
            \        if not isinstance(rows, list):\n            rows = []\n       \
            \ try:\n            row_count = int(parsed.get(\"row_count\", len(rows)))\n\
            \        except (TypeError, ValueError):\n            row_count = len(rows)\n\
            \        return {\n            \"is_ok\": \"true\",\n            \"data_json\"\
            : json.dumps(rows, ensure_ascii=False),\n            \"row_count\": str(row_count),\n\
            \            \"error_message\": \"\",\n            \"can_retry\": \"false\"\
            ,\n            \"denial_kind\": \"\",\n            \"denied_name\": \"\"\
            ,\n        }\n\n    message = parsed.get(\"message\") or \"Truy vấn không\
            \ được phép\"\n    retry, kind, denied_name = _denial(parsed, str(message))\n\
            \    return {\n        \"is_ok\": \"false\",\n        \"data_json\": \"\
            []\",\n        \"row_count\": \"0\",\n        \"error_message\": str(message),\n\
            \        \"can_retry\": retry,\n        \"denial_kind\": kind,\n       \
            \ \"denied_name\": denied_name,\n    }\n"
