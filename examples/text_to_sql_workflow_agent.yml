      - data:
          code: "import json\n\ndef _num(v):\n    if v is None or isinstance(v, bool):\n        return None\n    if isinstance(v, (int, float)):\n        return float(v)\n    s = str(v).strip().replace(\",\", \"\").replace(\" \", \"\")\n    try:\n        return float(s)\n    except ValueError:\n        return None\n\ndef _strip_fence(raw):\n    t = (raw or \"\").strip()\n    if t.startswith(\"```\"):\n        n = t.find(\"\\n\")\n        t = t[n + 1 :] if n >= 0 else t[3:]\n        if t.endswith(\"```\"):\n            t = t[:-3].strip()\n    return t\n\ndef _obj(text):\n    t = _strip_fence(text)\n    try:\n        parsed = json.loads(t)\n        if isinstance(parsed, dict):\n            return parsed\n    except json.JSONDecodeError:\n        pass\n    a = t.find(\"{\")\n    b = t.rfind(\"}\")\n    if a >= 0 and b > a:\n        try:\n            parsed = json.loads(t[a : b + 1])\n            if isinstance(parsed, dict):\n                return parsed\n        except json.JSONDecodeError:\n            pass\n    return None\n\ndef _collapse(labs, nums):\n    \"\"\"Sum values for the same label so ECharts pie does not error on duplicates.\"\"\"\n    acc = []\n    idx = {}\n    for lab, num in zip(labs, nums):\n        key = (lab or \"\").strip() or \"-\"\n        f = float(num)\n        if key in idx:\n            i = idx[key]\n            acc[i][1] += f\n        else:\n            idx[key] = len(acc)\n            acc.append([key, f])\n    out_labs = []\n    out_nums = []\n    for key, f in acc:\n        out_labs.append(key.replace(\";\", \",\"))\n        out_nums.append(str(int(f) if f == int(f) else f))\n    return out_labs, out_nums\n\ndef _size_label(value):\n    n = _num(value)\n    if n is None or n < 0:\n        return \"\" if value is None else str(value)\n    if n < 1024:\n        return str(int(n)) + \" B\"\n    if n < 1024 * 1024:\n        shown, unit = n / 1024, \" KB\"\n    elif n < 1024 * 1024 * 1024:\n        shown, unit = n / (1024 * 1024), \" MB\"\n    else:\n        shown, unit = n / (1024 * 1024 * 1024), \" GB\"\n    text = f\"{shown:.1f}\"\n    if text.endswith(\".0\"):\n        text = text[:-2]\n    return text.replace(\".\", \",\") + unit\n\ndef _mime_label(value):\n    raw = str(value).strip().lower()\n    known = {\n        \"application/pdf\": \"PDF\",\n        \"application/msword\": \"Word\",\n        \"application/vnd.openxmlformats-officedocument.wordprocessingml.document\": \"Word\",\n        \"application/vnd.ms-excel\": \"Excel\",\n        \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\": \"Excel\",\n        \"application/vnd.ms-powerpoint\": \"PowerPoint\",\n        \"application/vnd.openxmlformats-officedocument.presentationml.presentation\": \"PowerPoint\",\n        \"image/jpeg\": \"Ảnh JPEG\",\n        \"image/png\": \"Ảnh PNG\",\n        \"image/webp\": \"Ảnh\",\n        \"text/plain\": \"Văn bản\",\n        \"application/zip\": \"Tệp nén\",\n    }\n    if raw in known:\n        return known[raw]\n    if \"/\" in raw:\n        return raw.split(\"/\")[-1]\n    return str(value)\n\ndef _status_label(value, key=\"\"):\n    if value is None:\n        return \"\"\n    text = str(value)\n    stages = {\n        \"intake\": \"Tiếp nhận\",\n        \"case_review\": \"Nghiên cứu hồ sơ\",\n        \"investigation\": \"Điều tra\",\n        \"prosecution\": \"Truy tố\",\n        \"first_instance\": \"Xét xử sơ thẩm\",\n        \"appeal\": \"Xét xử phúc thẩm\",\n        \"cassation\": \"Giám đốc thẩm\",\n        \"petition_filed\": \"Nộp đơn khởi kiện\",\n        \"petition_amendment\": \"Sửa đổi, bổ sung đơn khởi kiện\",\n        \"court_fee_paid\": \"Nộp tạm ứng án phí\",\n        \"case_accepted\": \"Tòa thụ lý\",\n        \"mediation\": \"Hòa giải\",\n        \"dialogue\": \"Đối thoại\",\n        \"contract_signed\": \"Ký hợp đồng\",\n        \"drafting\": \"Soạn thảo hồ sơ\",\n        \"authority_submitted\": \"Đã gửi cơ quan thẩm quyền\",\n        \"response_handling\": \"Xử lý phản hồi\",\n        \"nghien_cuu\": \"Nghiên cứu hồ sơ ban đầu\",\n        \"tu_cach\": \"Xác định tư cách thân chủ\",\n        \"giai_doan\": \"Xác định giai đoạn vụ án\",\n        \"gui_ho_so\": \"Gửi hồ sơ bào chữa / bảo vệ\",\n        \"nhan_giay\": \"Được cấp giấy bào chữa, bảo vệ\",\n        \"sao_chup\": \"Sao chụp hồ sơ, tài liệu, chứng cứ\",\n        \"gap_than_chu\": \"Gặp bị can / bị cáo\",\n        \"chung_cu\": \"Thu thập và đánh giá chứng cứ\",\n        \"noi_dung\": \"Chuẩn bị nội dung bào chữa\",\n        \"first_instance_judgment\": \"Bản án sơ thẩm có hiệu lực\",\n        \"appeal_judgment\": \"Bản án phúc thẩm\",\n        \"cassation_decision\": \"Quyết định giám đốc thẩm\",\n        \"client_terminated\": \"Khách hàng chấm dứt\",\n        \"petition_withdrawn\": \"Rút đơn / thỏa thuận ngoài tòa\",\n        \"mediation_settled\": \"Hòa giải thành\",\n        \"dialogue_settled\": \"Đối thoại thành\",\n        \"succeeded\": \"Thành công\",\n        \"failed\": \"Thất bại\",\n        \"partially_succeeded\": \"Thành công một phần\",\n        \"other\": \"Khác\",\n    }\n    by_key = {\n        \"direction\": {\"in\": \"Thu\", \"out\": \"Chi\", \"incoming\": \"Đến\", \"outgoing\": \"Đi\"},\n        \"profile_kind\": {\"client\": \"Khách hàng\", \"lead\": \"Tiềm năng\"},\n        \"type\": {\"individual\": \"Cá nhân\", \"business\": \"Doanh nghiệp\"},\n        \"gender\": {\"male\": \"Nam\", \"female\": \"Nữ\", \"other\": \"Khác\"},\n        \"source\": {\n            \"referral\": \"Giới thiệu\", \"website\": \"Website\", \"walk_in\": \"Đến trực tiếp\",\n            \"social_media\": \"Mạng xã hội\", \"advertisement\": \"Quảng cáo\", \"other\": \"Khác\",\n        },\n        \"lead_stage\": {\n            \"new\": \"Mới\", \"consulting\": \"Đang tư vấn\", \"proposal\": \"Báo giá\",\n            \"negotiating\": \"Đàm phán\", \"won\": \"Thành công\", \"lost\": \"Không thành\",\n        },\n        \"status\": {\n            \"received\": \"Đã nhận\", \"processing\": \"Đang xử lý\", \"replied\": \"Đã trả lời\",\n            \"completed\": \"Hoàn thành\", \"canceled\": \"Đã hủy\", \"draft\": \"Nháp\",\n            \"pending_sign\": \"Chờ ký\", \"signed\": \"Đã ký\", \"sent\": \"Đã gửi\",\n            \"acknowledged\": \"Đã xác nhận\", \"potential\": \"Tiềm năng\", \"archived\": \"Lưu trữ\",\n            \"away\": \"Vắng mặt\",\n        },\n        \"stage\": stages,\n        \"outcome\": stages,\n    }\n    column = by_key.get(key) or {}\n    if text in column:\n        return column[text]\n    labels = {\n        \"new\": \"Mới\",\n        \"in_progress\": \"Đang xử lý\",\n        \"on_hold\": \"Tạm dừng\",\n        \"closed\": \"Hoàn thành\",\n        \"litigation\": \"Tố tụng\",\n        \"legal_service\": \"Dịch vụ pháp lý\",\n        \"emergency\": \"Khẩn cấp\",\n        \"high\": \"Cao\",\n        \"medium\": \"Trung bình\",\n        \"low\": \"Thấp\",\n        \"pending\": \"Chờ xử lý\",\n        \"succeeded\": \"Đã thanh toán\",\n        \"cancelled\": \"Đã hủy\",\n        \"active\": \"Đang hoạt động\",\n        \"inactive\": \"Ngừng hoạt động\",\n        \"away\": \"Vắng mặt\",\n        \"potential\": \"Tiềm năng\",\n        \"archived\": \"Lưu trữ\",\n        \"client\": \"Khách hàng\",\n        \"lead\": \"Tiềm năng\",\n        \"individual\": \"Cá nhân\",\n        \"business\": \"Doanh nghiệp\",\n        \"male\": \"Nam\",\n        \"female\": \"Nữ\",\n        \"in\": \"Thu\",\n        \"out\": \"Chi\",\n        \"incoming\": \"Đến\",\n        \"outgoing\": \"Đi\",\n        \"received\": \"Đã nhận\",\n        \"processing\": \"Đang xử lý\",\n        \"replied\": \"Đã trả lời\",\n        \"completed\": \"Hoàn thành\",\n        \"canceled\": \"Đã hủy\",\n        \"draft\": \"Nháp\",\n        \"pending_sign\": \"Chờ ký\",\n        \"signed\": \"Đã ký\",\n        \"sent\": \"Đã gửi\",\n        \"acknowledged\": \"Đã xác nhận\",\n        \"referral\": \"Giới thiệu\",\n        \"website\": \"Website\",\n        \"walk_in\": \"Đến trực tiếp\",\n        \"social_media\": \"Mạng xã hội\",\n        \"advertisement\": \"Quảng cáo\",\n        \"consulting\": \"Đang tư vấn\",\n        \"proposal\": \"Báo giá\",\n        \"negotiating\": \"Đàm phán\",\n        \"won\": \"Thành công\",\n        \"lost\": \"Không thành\",\n    }\n    labels.update(stages)\n    labels[\"succeeded\"] = \"Đã thanh toán\"\n    if key in (\"stage\", \"outcome\") and text in stages:\n        return stages[text]\n    if key == \"mime_type\":\n        return _mime_label(text)\n    if key == \"purpose\" and text == \"attachment\":\n        return \"Tệp đính kèm\"\n    if key == \"purpose\" and text == \"inline_content\":\n        return \"Nội dung nhúng\"\n    return labels.get(text, text)\n\ndef _invented_token(msg, blob):\n    import re\n    for tok in re.findall(r\"\\b(?:VV-?\\d+|[A-Z]{1,8}(?:-[A-Z0-9]+)+)\\b\", msg or \"\"):\n        if tok not in (blob or \"\"):\n            return True\n    return False\n\ndef _aggregate_row(rows):\n    if len(rows) != 1:\n        return False\n    keys = list(rows[0].keys())\n    if not keys or any(k in (\"code\", \"name\", \"title\") for k in keys):\n        return False\n    return all(_num(rows[0][k]) is not None for k in keys)\n\ndef _markdown_table(rows):\n    headers = {\"code\": \"Mã\", \"name\": \"Tên\", \"status\": \"Trạng thái\", \"title\": \"Tiêu đề\", \"category\": \"Loại\"}\n    keys = []\n    for row in rows:\n        for key in row.keys():\n            if key not in keys:\n                keys.append(key)\n    if not keys:\n        return \"\"\n    head = \"|\" + \"|\".join(_header(k) for k in keys) + \"|\"\n    sep = \"|\" + \"|\".join(\"---\" for _ in keys) + \"|\"\n    lines = [head, sep]\n    for row in rows:\n        cells = []\n        for key in keys:\n            raw = row.get(key)\n            cell = _status_label(raw, key).replace(\"|\", \"/\").replace(\"\\n\", \" \")\n            if key == \"progress\" and cell != \"\":\n                cell = cell + \"%\"\n            if key == \"size\":\n                cell = _size_label(raw)\n            cells.append(cell)\n        lines.append(\"|\" + \"|\".join(cells) + \"|\")\n    return \"\\n\".join(lines)\n\ndef _header(key):\n    labels = {\n        \"code\": \"Mã\",\n        \"id\": \"Mã số\",\n        \"name\": \"Tên\",\n        \"status\": \"Trạng thái\",\n        \"title\": \"Tiêu đề\",\n        \"category\": \"Loại\",\n        \"priority\": \"Mức ưu tiên\",\n        \"progress\": \"Tiến độ\",\n        \"due_date\": \"Hạn\",\n        \"deadline\": \"Hạn\",\n        \"open_date\": \"Ngày mở\",\n        \"created_at\": \"Ngày tạo\",\n        \"amount\": \"Số tiền\",\n        \"direction\": \"Chiều\",\n        \"stage\": \"Giai đoạn\",\n        \"outcome\": \"Kết quả\",\n        \"outcome_note\": \"Ghi chú kết quả\",\n        \"closed_at\": \"Ngày đóng\",\n        \"description\": \"Mô tả\",\n        \"notes\": \"Ghi chú\",\n        \"hold_reason\": \"Lý do tạm dừng\",\n        \"client_name\": \"Khách hàng\",\n        \"case_name\": \"Tên vụ việc\",\n        \"case_type_name\": \"Loại vụ việc\",\n        \"payment_amount\": \"Giá trị hợp đồng\",\n        \"payment_currency\": \"Tiền tệ\",\n        \"payment_due_date\": \"Hạn thanh toán\",\n        \"is_canceled\": \"Đã hủy\",\n        \"is_completed\": \"Đã hoàn thành\",\n        \"effective_from\": \"Hiệu lực từ\",\n        \"expires_at\": \"Hết hạn\",\n        \"profile_kind\": \"Nhóm\",\n        \"type\": \"Loại hình\",\n        \"lead_stage\": \"Giai đoạn lead\",\n        \"company\": \"Công ty\",\n        \"currency\": \"Tiền tệ\",\n        \"paid_at\": \"Ngày thu\",\n        \"installment_no\": \"Đợt\",\n        \"contract_id\": \"Hợp đồng\",\n        \"case_id\": \"Vụ việc\",\n        \"client_id\": \"Khách hàng\",\n        \"lead_lawyer_id\": \"Luật sư phụ trách\",\n        \"assigned_to\": \"Người phụ trách\",\n        \"created_by\": \"Người tạo\",\n        \"held_at\": \"Lúc tạm dừng\",\n        \"position\": \"Chức danh\",\n        \"source\": \"Nguồn\",\n        \"gender\": \"Giới tính\",\n        \"reference\": \"Chứng từ\",\n        \"total\": \"Tổng\",\n        \"total_cases\": \"Số lượng\",\n        \"total_revenue\": \"Tổng\",\n        \"count\": \"Số lượng\",\n        \"mime_type\": \"Loại tệp\",\n        \"size\": \"Dung lượng\",\n        \"documentable_type\": \"Gắn với\",\n        \"uploaded_at\": \"Ngày tải lên\",\n        \"uploaded_by\": \"Người tải lên\",\n        \"purpose\": \"Mục đích\",\n    }\n    key = str(key)\n    if key in labels:\n        return labels[key]\n    if \" \" in key:\n        return key\n    return key.replace(\"_\", \" \")\n\ndef _render_data(data_json):\n    try:\n        rows = json.loads(data_json or \"[]\")\n    except Exception:\n        return \"Không có dữ liệu phù hợp.\"\n    if not isinstance(rows, list):\n        return \"Không có dữ liệu phù hợp.\"\n    rows = [row for row in rows if isinstance(row, dict)]\n    if not rows:\n        return \"Không có dữ liệu phù hợp.\"\n    if _aggregate_row(rows):\n        lines = []\n        for key, value in rows[0].items():\n            shown = _size_label(value) if key == \"size\" else _status_label(value)\n            if isinstance(value, float) and value == int(value) and key != \"size\":\n                shown = str(int(value))\n            lines.append(_header(key) + \": \" + shown)\n        return \"\\n\".join(lines)\n    return \"Có \" + str(len(rows)) + \" kết quả:\\n\\n\" + _markdown_table(rows)\n\ndef _chart_numbers_in_data(nums, data_json):\n    import re\n    digits = re.sub(r\"\\D\", \"\", data_json or \"\")\n    for num in nums:\n        token = re.sub(r\"\\D\", \"\", str(num))\n        if token and token not in digits:\n            return False\n    return True\n\ndef _wants_prose(question):\n    q = (question or \"\").lower()\n    keys = (\n        \"tóm tắt\", \"tom tat\", \"tổng hợp\", \"tong hop\", \"ngắn gọn\", \"ngan gon\",\n        \"một câu\", \"mot cau\", \"không cần bảng\", \"khong can bang\", \"đừng liệt kê\",\n        \"dung liet ke\", \"giải thích ngắn\", \"chi tiết\", \"chi tiet\",\n    )\n    return any(k in q for k in keys)\n\ndef _prose_summary(data_json):\n    try:\n        rows = json.loads(data_json or \"[]\")\n    except Exception:\n        return \"Không có dữ liệu phù hợp.\"\n    if not isinstance(rows, list):\n        return \"Không có dữ liệu phù hợp.\"\n    rows = [row for row in rows if isinstance(row, dict)]\n    if not rows:\n        return \"Không có dữ liệu phù hợp.\"\n    if _aggregate_row(rows):\n        return _render_data(data_json)\n    labels = []\n    for row in rows[:5]:\n        label = row.get(\"title\") or row.get(\"name\") or row.get(\"code\") or \"\"\n        label = str(label).strip()\n        if label:\n            labels.append(label)\n    n = len(rows)\n    if not labels:\n        return \"Có \" + str(n) + \" kết quả.\"\n    tail = \"\"\n    if n > len(labels):\n        tail = \", và \" + str(n - len(labels)) + \" kết quả khác\"\n    return \"Có \" + str(n) + \" kết quả: \" + \", \".join(labels) + tail + \".\"\n\ndef _detail_lines(data_json):\n    try:\n        rows = json.loads(data_json or \"[]\")\n    except Exception:\n        return \"Không có dữ liệu phù hợp.\"\n    if not isinstance(rows, list):\n        return \"Không có dữ liệu phù hợp.\"\n    rows = [row for row in rows if isinstance(row, dict)]\n    if not rows:\n        return \"Không có dữ liệu phù hợp.\"\n    if len(rows) > 3:\n        return _render_data(data_json)\n    order = (\n        \"client_name\", \"case_type_name\", \"category\", \"status\", \"priority\",\n        \"stage\", \"outcome\", \"open_date\", \"deadline\", \"due_date\", \"closed_at\",\n        \"progress\", \"hold_reason\", \"description\", \"notes\", \"outcome_note\",\n    )\n    blocks = []\n    for row in rows:\n        code = str(row.get(\"code\") or \"\").strip()\n        name = str(row.get(\"title\") or row.get(\"name\") or \"\").strip()\n        if code and name:\n            head = \"**\" + code + \"** — \" + name\n        elif name:\n            head = \"**\" + name + \"**\"\n        elif code:\n            head = \"**\" + code + \"**\"\n        else:\n            head = \"**Chi tiết**\"\n        seen = {\"code\", \"name\", \"title\", \"id\"}\n        lines = [head, \"\"]\n        keys = [k for k in order if k in row]\n        for key in row.keys():\n            if key not in seen and key not in keys:\n                keys.append(key)\n        for key in keys:\n            if key in seen:\n                continue\n            value = row.get(key)\n            if value is None or str(value).strip() == \"\":\n                continue\n            cell = _status_label(value, key).replace(\"\\n\", \" \").replace(\"|\", \"/\")\n            if key == \"progress\" and cell != \"\":\n                cell = cell + \"%\"\n            if key == \"size\":\n                cell = _size_label(raw)\n            lines.append(\"- **\" + _header(key) + \":** \" + cell)\n        if len(lines) > 2:\n            blocks.append(\"\\n\".join(lines))\n    return \"\\n\\n\".join(blocks) if blocks else \"Không có dữ liệu phù hợp.\"\n\ndef _user_message(question, parsed, data_json):\n    q = (question or \"\").lower()\n    if \"chi tiết\" in q or \"chi tiet\" in q:\n        return _detail_lines(data_json)\n    if not _wants_prose(question):\n        return _render_data(data_json)\n    answer = \"\"\n    if isinstance(parsed, dict):\n        answer = str(parsed.get(\"answer\") or \"\").strip()\n    if answer and \"|\" not in answer and not _invented_token(answer, data_json):\n        return answer\n    return _prose_summary(data_json)\n\ndef main(llm_text=\"\", data_json=\"[]\", question=\"\"):\n    empty = {\n        \"user_message\": (llm_text or \"\").strip() or \"Chưa có dữ liệu phù hợp.\",\n        \"has_chart\": \"false\",\n        \"chart_kind\": \"line\",\n        \"chart_title\": \"Biểu đồ\",\n        \"chart_data\": \"0\",\n        \"chart_labels\": \"-\",\n    }\n    parsed = _obj(llm_text)\n    if not parsed:\n        out = dict(empty)\n        out[\"user_message\"] = _user_message(question, None, data_json)\n        out[\"has_chart\"] = \"false\"\n        return out\n    msg = _user_message(question, parsed, data_json)\n    chart = parsed.get(\"chart\")\n    if not isinstance(chart, dict):\n        out = dict(empty)\n        out[\"user_message\"] = msg\n        return out\n    title = chart.get(\"title\")\n    if isinstance(title, dict):\n        title = title.get(\"text\")\n    title = str(title or \"Biểu đồ\").strip() or \"Biểu đồ\"\n    labels = chart.get(\"labels\") or chart.get(\"categories\") or []\n    values = chart.get(\"values\") or chart.get(\"data\") or []\n    xa = chart.get(\"xAxis\")\n    if isinstance(xa, dict) and not labels:\n        labels = xa.get(\"data\") or []\n    series = chart.get(\"series\")\n    stype = str(chart.get(\"type\") or \"\")\n    if isinstance(series, list) and series and isinstance(series[0], dict):\n        stype = str(series[0].get(\"type\") or stype)\n        if not values:\n            values = series[0].get(\"data\") or []\n    labs = []\n    nums = []\n    if isinstance(values, list) and values and isinstance(values[0], dict):\n        for item in values:\n            if not isinstance(item, dict):\n                continue\n            f = _num(item.get(\"value\"))\n            if f is None:\n                continue\n            labs.append(str(item.get(\"name\") or \"\"))\n            nums.append(f)\n    elif isinstance(labels, list) and isinstance(values, list):\n        n = min(len(labels), len(values))\n        i = 0\n        while i < n:\n            f = _num(values[i])\n            if f is not None:\n                labs.append(str(labels[i] or \"\"))\n                nums.append(f)\n            i += 1\n    labs, nums = _collapse(labs, nums)\n    if len(nums) < 2 or not _chart_numbers_in_data(nums, data_json):\n        out = dict(empty)\n        out[\"user_message\"] = msg\n        return out\n    raw_kind = stype.strip().lower()\n    if raw_kind in (\"pie\", \"donut\", \"rose\"):\n        kind = \"pie\"\n    elif raw_kind in (\"bar\", \"column\"):\n        kind = \"bar\"\n    else:\n        kind = \"line\"\n    return {\n        \"user_message\": msg,\n        \"has_chart\": \"true\",\n        \"chart_kind\": kind,\n        \"chart_title\": title,\n        \"chart_data\": \";\".join(nums),\n        \"chart_labels\": \";\".join(labs),\n    }\n"
