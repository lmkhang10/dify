            utf-8\", \"replace\").strip()\n                if text:\n              \
            \      return text, \"gzip_truncated:\" + type(gzip_exc).__name__\n    \
            \        except Exception:\n                pass\n        return raw, \"\
            gzip_fail:\" + type(gzip_exc).__name__\n\ndef _is_jwt(token):\n    parts\
            \ = (token or \"\").split(\".\")\n    if len(parts) != 3 or not all(parts):\n\
            \        return False\n    if len(parts[2]) < 40:\n        return False\n\
            \    try:\n        padded = parts[1] + \"=\" * ((4 - len(parts[1]) % 4)\
            \ % 4)\n        json.loads(base64.urlsafe_b64decode(padded))\n        return\
            \ True\n    except Exception:\n        return False\n\ndef _dump(token_in,\
            \ base_in, token, base, token_how, base_how, code, reason):\n    lines =\
            \ [\n        \"Không khả thi khi sử dụng trực tiếp!\" if code else \"Embed\
            \ OK — giá trị đã giải nén:\",\n        \"\",\n    ]\n    if code:\n   \
            \     lines += [\"Mã: \" + code, \"Chi tiết: \" + reason, \"\"]\n    lines\
