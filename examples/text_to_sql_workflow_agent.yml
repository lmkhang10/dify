      - data:
          code: |
            def main(error_message: str, denial_kind: str, denied_name: str) -> dict:
                msg = (error_message or "").strip()
                kind = (denial_kind or "").strip()
                name = (denied_name or "").strip()
                if kind == "TABLE_DENIED":
                    label = name or "nhóm dữ liệu này"
                    user = (
                        "Vai trò của bạn không xem được "
                        + label
                        + ". Hãy hỏi lại mà không cần tên văn phòng, phòng ban hay dữ liệu ngoài phạm vi."
                    )
                elif kind == "COLUMN_DENIED":
                    label = name or "một trường"
                    user = (
                        "Vai trò của bạn không đọc được trường "
                        + label
                        + ". Hãy hỏi phiên bản không gồm thông tin nhạy cảm."
                    )
                else:
                    user = msg if msg else "Không thực hiện được truy vấn với quyền hiện tại."
                if "SELECT" in user.upper() or "```" in user:
                    user = "Không thực hiện được truy vấn với quyền hiện tại. Hãy diễn đạt lại câu hỏi."
                return {"user_message": user}
