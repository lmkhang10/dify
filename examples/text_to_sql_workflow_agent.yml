          code: "import json\n\ndef _num(v):\n    if v is None or isinstance(v, bool):\n        return None\n    if isinstance(v, (int, float)):\n        return float(v)\n    s = str(v).strip().replace(\",\", \"\").replace(\" \", \"\")\n    try:\n        return float(s)\n    except ValueError:\n        return None\n\ndef _strip_fence(raw):\n    t = (raw or \"\").strip()\n    if t.startswith(\"```\"):\n        n = t.find(\"\\n\")\n        t = t[n + 1 :] if n >= 0 else t[3:]\n        if t.endswith(\"```\"):\n            t = t[:-3].strip()\n    return t\n\ndef _obj(text):\n    t = _strip_fence(text)\n    try:\n        parsed = json.loads(t)\n        if isinstance(parsed, dict):\n            return parsed\n    except json.JSONDecodeError:\n        pass\n    a = t.find(\"{\")\n    b = t.rfind(\"}\")\n    if a >= 0 and b > a:\n        try:\n            parsed = json.loads(t[a : b + 1])\n            if isinstance(parsed, dict):\n                return parsed\n        except json.JSONDecodeError:\n            pass\n    return None\n\ndef _collapse(labs, nums):\n    \"\"\"Sum values for the same label so ECharts pie does not error on duplicates.\"\"\"\n    acc = []\n    idx = {}\n    for lab, num in zip(labs, nums):\n        key = (lab or \"\").strip() or \"-\"\n        f = float(num)\n        if key in idx:\n            i = idx[key]\n            acc[i][1] += f\n        else:\n            idx[key] = len(acc)\n            acc.append([key, f])\n    out_labs = []\n    out_nums = []\n    for key, f in acc:\n        out_labs.append(key.replace(\";\", \",\"))\n        out_nums.append(str(int(f) if f == int(f) else f))\n    return out_labs, out_nums\n\ndef _size_label(value):\n    n = _num(value)\n    if n is None or n < 0:\n        return \"\" if value is None else str(value)\n    if n < 1024:\n        return str(int(n)) + \" B\"\n    if n < 1024 * 1024:\n        shown, unit = n / 1024, \" KB\"\n    elif n < 1024 * 1024 * 1024:\n        shown, unit = n / (1024 * 1024), \" MB\"\n    else:\n        shown, unit = n / (1024 * 1024 * 1024), \" GB\"\n    text = f\"{shown:.1f}\"\n    if text.endswith(\".0\"):\n        text = text[:-2]\n    return text.replace(\".\", \",\") + unit\n\ndef _mime_label(value):\n    raw = str(value).strip().lower()\n    known = {\n        \"application/pdf\": \"PDF\",\n        \"application/msword\": \"Word\",\n        \"application/vnd.openxmlformats-officedocument.wordprocessingml.document\": \"Word\",\n        \"application/vnd.ms-excel\": \"Excel\",\n        \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\": \"Excel\",\n        \"application/vnd.ms-powerpoint\": \"PowerPoint\",\n        \"application/vnd.openxmlformats-officedocument.presentationml.presentation\": \"PowerPoint\",\n        \"image/jpeg\": \"Ảnh JPEG\",\n        \"image/png\": \"Ảnh PNG\",\n        \"image/webp\": \"Ảnh\",\n        \"text/plain\": \"Văn bản\",\n        \"application/zip\": \"Tệp nén\",\n    }\n    if raw in known:\n        return known[raw]\n    if \"/\" in raw:\n        return raw.split(\"/\")[-1]\n    return str(value)\n\ndef _status_label(value, key=\"\"):\n    if value is None:\n        return \"\"\n    text = str(value)\n    stages = {\n        \"intake\": \"Tiếp nhận\",\n        \"case_review\": \"Nghiên cứu hồ sơ\",\n        \"investigation\": \"Điều tra\",\n        \"prosecution\": \"Truy tố\",\n        \"first_instance\": \"Xét xử sơ thẩm\",\n        \"appeal\": \"Xét xử phúc thẩm\",\n        \"cassation\": \"Giám đốc thẩm\",\n        \"petition_filed\": \"Nộp đơn khởi kiện\",\n        \"petition_amendment\": \"Sửa đổi, bổ sung đơn khởi kiện\",\n        \"court_fee_paid\": \"Nộp tạm ứng án phí\",\n        \"case_accepted\": \"Tòa thụ lý\",\n        \"mediation\": \"Hòa giải\",\n        \"dialogue\": \"Đối thoại\",\n        \"contract_signed\": \"Ký hợp đồng\",\n        \"drafting\": \"Soạn thảo hồ sơ\",\n        \"authority_submitted\": \"Đã gửi cơ quan thẩm quyền\",\n        \"response_handling\": \"Xử lý