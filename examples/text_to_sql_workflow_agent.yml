      - data:
          code: "import hashlib\nimport hmac\nimport json\nimport time\nimport uuid\n\nLFMS_GRANT_PATH = \"/api/internal/dify/sql/grant\"\nHTTP_METHOD = \"POST\"\n\ndef _sign(raw_body: str, timestamp: str, nonce: str, secret: str) -> str:\n    body_hash = hashlib.sha256(raw_body.encode(\"utf-8\")).hexdigest()\n    signing_string = f\"{timestamp}\\n{nonce}\\n{HTTP_METHOD}\\n{LFMS_GRANT_PATH}\\n{body_hash}\"\n    return hmac.new(secret.encode(\"utf-8\"), signing_string.encode(\"utf-8\"), hashlib.sha256).hexdigest()\n\ndef main(lfms_token: str, hmac_secret: str) -> dict:\n    payload = {\"embed_token\": (lfms_token or \"\").strip()}\n    request_json = json.dumps(payload, ensure_ascii=False, separators=(\",\", \":\"))\n    timestamp = str(int(time.time()))\n    nonce = str(uuid.uuid4())\n    secret = (hmac_secret or \"\").strip()\n    signature = _sign(request_json, timestamp, nonce, secret) if secret else \"\"\n    return {\n        \"request_json\": request_json,\n        \"timestamp\": timestamp,\n        \"nonce\": nonce,\n        \"signature\": signature,\n    }\n"
