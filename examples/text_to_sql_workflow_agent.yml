app:
  description: 'Advanced Chat: Knowledge → LLM (SQL) → LFMS SQL Gateway → tóm tắt.


    LFMS chạy policy + execute DB — xem examples/docs/lfms-sql-policy-api.md.


    Sau import:

    1. Knowledge Retrieval → dataset LFMS (examples/knowledge/, gồm followups.md)

    2. Chọn model trên LLM nodes (kể cả Rewrite câu hỏi)

    3. Workflow → Environment → DIFY_LFMS_HMAC_SECRET

    4. Embed LFMS: lfms_token + lfms_api_base (hidden); SSRF allowlist domain (docs
    §5)

    5. Overview → tắt Show workflow steps → Publish WebApp

    6. Biểu đồ: LLM tóm tắt trả JSON {answer, chart}. Node Parse Chart Payload map
    sang biến ECharts (title/data/labels). Tool pie/line chỉ chạy khi chart != null.


    Không cần plugin database / credential MySQL trên Dify.

    '
  icon: 🔗
  icon_background: '#E8F3FF'
  icon_type: emoji
  mode: advanced-chat
  name: Text-to-SQL Chatflow (LFMS)
  use_icon_as_answer_icon: false
