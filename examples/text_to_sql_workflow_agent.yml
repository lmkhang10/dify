      - data:
          code: "ENUM_CARD = \"\"\"### ENUM (luôn dùng; cấm bịa gần nghĩa) ###\npayments.status:\
            \ pending|succeeded|cancelled — CẤM paid/unpaid\npayments.direction: in|out\
            \ — CẤM inbound/outbound\nCông nợ = SUM(payments.amount) WHERE status='pending'\
            \ AND direction='in'\nCẤM SUM(contracts.payment_amount)-SUM(payments.amount)\
            \ trên cùng JOIN\nofficial_dispatches.direction: incoming|outgoing — CẤM\
            \ inbound/outbound/in/out\nofficial_dispatches.status incoming: received|processing|replied|completed|canceled\n\
            official_dispatches.status outgoing: draft|pending_sign|signed|sent|acknowledged\n\
            clients.profile_kind: client|lead\nclients.type: individual|business\nclients.status:\
            \ active|inactive|potential|archived\nclients.source: referral|website|walk_in|social_media|advertisement|other\n\
            clients.lead_stage: new|consulting|proposal|negotiating|won|lost\ncases.category:\
            \ litigation|legal_service\ncases.status: new|in_progress|on_hold|closed\n\
            tasks: không cột status; priority emergency|high|medium|low; progress 0-100\n\
            users.status: active|away|inactive\ndocuments: id, name, mime_type, size, documentable_type, documentable_id, uploaded_by, uploaded_at, deleted_at. KHÔNG CÓ file_path, path, disk, case_id. Nơi gắn — viết nhãn tiếng Việt, LFMS đổi thành class: Vụ việc, Khách hàng, Công việc, Hợp đồng, Công văn. JOIN: documents.documentable_id = <bảng cha>.id AND documents.documentable_type = nhãn AND documents.deleted_at IS NULL. Cha: vụ=cases, khách=clients, việc=tasks, hợp đồng=contracts, công văn=official_dispatches. purpose chỉ khi hỏi mục đích: Tệp đính kèm | Nội dung nhúng. Đọc kết quả: size là byte; mime_type là loại tệp (PDF, Word, Excel, ảnh); documentable_type là nơi gắn. File tôi đã upload: SELECT documents.name, documents.mime_type, documents.size, documents.uploaded_at — không WHERE uploaded_by (LFMS lọc).\nCỘT KHÓA — chỉ các tên này, cấm bịa:\ncases: id, organization_id, code, name, client_id, case_type_id, category, status, priority, hold_reason, held_at, held_by, open_date, deadline, closed_at, reopen_count, description, notes, lead_lawyer_id, created_by, stage, outcome, outcome_note, workflow_definition_id, workflow_version_id, stage_due_at, client_notified_at, created_at, updated_at, deleted_at.\ncases KHÔNG CÓ: fee_estimate, billing_method, area, on_hold, amount. Phí vụ = contracts.payment_amount JOIN contracts.case_id.\ncases.priority: high|medium|low. stage/outcome không enum cố định — SELECT nguyên, cấm won/filing/trial.\ncontracts: id, organization_id, code, name, client_id, case_id, payment_description, payment_amount, payment_currency, payment_due_date, referral_source, effective_from, expires_at, is_canceled, canceled_at, canceled_reason, is_completed, completed_at, created_by, created_at, updated_at, deleted_at.\ncontracts KHÔNG CÓ: type, status, template_id, amount, signed_at, total_amount.\nclients KHÔNG CÓ: city, district, ward.\ncase_types: id, organization_id, name, slug, category, workflow, workflow_definition_id, created_at, updated_at. KHÔNG description, area.\n\"\"\"\n\nFALLBACK = \"\"\"### FALLBACK\
            \ SCHEMA (KB empty) ###\nGlossary: khách=clients (profile_kind client|lead);\
            \ vụ=cases (category litigation|legal_service); HĐ=contracts.payment_amount;\
            \ đợt thu=payments; việc=tasks + task_assignees\nKHÔNG JOIN organizations/departments\
            \ chỉ để lấy tên. Lọc theo tên loại vụ: JOIN case_types. Cấm UNION/WITH/SELECT\
            \ *. Subquery IN/EXISTS được (LFMS rewrite tenant).\nTable: clients — id,\
            \ organization_id, name, profile_kind, type, status, lead_stage, assigned_to,\
            \ created_by, deleted_at\nTable: cases — id, code, name, client_id, category,\
            \ status, priority, hold_reason, held_at, open_date, deadline, closed_at, stage, outcome, lead_lawyer_id, case_type_id, deleted_at. KHÔNG fee_estimate/billing_method/area/on_hold.\
            \ Cấm cột on_hold boolean.\nTable: contracts — id, code, name, client_id, case_id, payment_amount, payment_currency, payment_due_date, is_canceled, is_completed, deleted_at. KHÔNG type/status/template_id/amount.\nTable: tasks — id, title, case_id,\
            \ created_by, priority, progress, due_date, deleted_at. Không cột status/assigned_to.\n\
            Table: task_assignees — task_id, user_id\nTable: documents — id, name, mime_type, size, documentable_type, uploaded_at, deleted_at. KHÔNG file_path/path/case_id. Nơi gắn viết tiếng Việt: Vụ việc, Khách hàng, Công việc, Hợp đồng, Công văn. size = byte. File của tôi: không WHERE uploaded_by.\nTable: payments — contract_id,\
            \ amount, currency, due_date, status, direction, paid_at\nTable: users —\
            \ id, name, position, status; cấm password\nTable: organizations — id, name,\
            \ is_active, deleted_at; cấm smtp_password; đừng JOIN trang trí\nJOIN tối\
            \ thiểu: cases.client_id=clients.id; contracts.client_id=clients.id; payments.contract_id=contracts.id\n\
            Bảng cấm: service_plans, organization_subscriptions, case_checklist_items,\
            \ workflow_versions, vanna_*\n\"\"\"\n\ndef main(chunks) -> dict:\n    parts\
            \ = []\n    items = chunks if isinstance(chunks, list) else []\n    for\
            \ item in items:\n        if not isinstance(item, dict):\n            continue\n\
            \        title = item.get(\"title\") or \"\"\n        content = item.get(\"\
            content\") or \"\"\n        if content.strip():\n            parts.append(f\"\
            ## {title}\\n{content}\".strip())\n    body = \"\\n\\n\".join(parts) if\
            \ parts else FALLBACK\n    schema_docs = ENUM_CARD + \"\\n\\n\" + body\n\
            \    return {\"schema_docs\": schema_docs, \"hit_count\": len(parts)}\n"
          code_language: python3
          desc: Ghép chunk KB; luôn prepend ENUM_CARD (retrieval hay miss)
          outputs:
            hit_count:
              children: null
